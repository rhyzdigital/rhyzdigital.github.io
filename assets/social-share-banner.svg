    </linearGradient>
    <clipPath id="icon-1"><rect x="685" y="121" width="112" height="112" rx="25"/></clipPath>
    <clipPath id="icon-2"><rect x="884" y="121" width="112" height="112" rx="25"/></clipPath>
    <clipPath id="icon-3"><rect x="685" y="320" width="112" height="112" rx="25"/></clipPath>
